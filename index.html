<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Elite Show Community — Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="images/logo/apple-touch-icon.png">
  <meta name="description"
    content="The Elite Show Community is getting the room ready. Leave your name and WhatsApp number and we'll tell you when the doors open.">
  <meta property="og:title" content="The Elite Show Community — Coming Soon">
  <meta property="og:description" content="The room is getting ready.">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="coming_soon.css">
</head>

<body>
  <header class="cs-top">
    <span class="cs-logo"><img src="images/logo/the-elite-show-horizontal.svg" alt="The Elite Show Community" width="134" height="40"></span>
  </header>

  <main class="cs-main">
    <h1 class="cs-title" id="csTitle" aria-live="polite">The room is getting ready.</h1>
    <p class="cs-sub">Mentor sessions, meetups and workshops for students, founders and creators.</p>

    <div class="cs-scene" id="csScene">
      <div class="cs-floor-light" id="csFloorLight"></div>
      <button class="cs-door" id="csDoor" type="button" aria-label="Peek through the door">
        <span class="cs-room" aria-hidden="true">
          <img class="cs-poster p1" src="posters/2026-10-03-mentor-session-09.jpg" alt="">
          <img class="cs-poster p2" src="posters/2026-10-10-mentor-session-10.jpg" alt="">
          <img class="cs-poster p3" src="posters/2026-09-19-mentor-session-08.jpg" alt="">
          <span class="cs-crowd"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </span>
        <span class="cs-leaf" id="csLeaf" aria-hidden="true">
          <span class="cs-panel"></span>
          <span class="cs-panel"></span>
          <span class="cs-plate">Members only</span>
          <span class="cs-handle"></span>
        </span>
      </button>
      <span class="cs-hint" id="csHint">Move closer to peek</span>
    </div>

    <form class="cs-form" id="csForm" novalidate>
      <p class="cs-form-title">Knock to get on the list</p>
      <div class="cs-fields">
        <input class="cs-input" id="csName" name="name" type="text" placeholder="Your name" autocomplete="name"
          maxlength="60" aria-label="Your name" required>
        <input class="cs-input" id="csPhone" name="phone" type="tel" placeholder="WhatsApp number" autocomplete="tel"
          maxlength="20" aria-label="WhatsApp number" required>
        <button class="cs-knock" id="csKnock" type="submit">Knock</button>
      </div>
      <p class="cs-msg" id="csMsg" role="status"></p>
    </form>
  </main>

  <footer class="cs-foot">
    <p>Saturday 31st Oct 2026</p>
    <nav class="cs-legal" aria-label="Legal">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
      <a href="refunds.html">Refunds &amp; Cancellation</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </footer>

  <script src="coming_soon.js"></script>
</body>

</html>
