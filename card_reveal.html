/* ---------------- canvas texture helpers ---------------- */

canvas.addEventListener('pointerdown', e => {

canvas.addEventListener('pointermove', e => {

  if (!down) { canvas.classList.toggle('press', state === S.SEALED && overSeal(e)); return; }

  if (Math.hypot(dx, dy) > 8) down.moved = true;
  const now = performance.now(), vel = Math.abs(e.clientY - down.lastY) / Math.max(1, now - down.lastT); down.lastY = e.clientY; down.lastT = now;
  if (state === S.PRESSING) { ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px'; }

    Sound.set(Sound.paper, Math.min(.9, vel * .9));

});
function release() {
  if (!down) return;

  if (state === S.PRESSING) { state = S.SEALED; sealWhole.visible = true; sealA.visible = sealB.visible = false; ring.classList.remove('on'); hint('Press and hold the seal'); }
  if (state === S.CRACKED && tap) autoFlap = Math.PI - .09;
  if (state === S.OPENING) { autoFlap = theta > Math.PI * .4 ? Math.PI - .09 : 0; Sound.set(Sound.paper, 0); }
  if (state === S.OPEN && tap) autoSlide = 1;
  if (state === S.PULLING) { autoSlide = slide > .3 ? 1 : 0; Sound.set(Sound.slide, 0); }

canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
canvas.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return; e.preventDefault(); Sound.init();
  if (state === S.SEALED) crack(); else if (state === S.CRACKED) autoFlap = Math.PI - .09; else if (state === S.OPEN) autoSlide = 1; else if (state === S.REVEALED) flipTarget = flipTarget ? 0 : Math.PI;
});
$('flipBtn').addEventListener('click', () => { flipTarget = flipTarget ? 0 : Math.PI; });
$('replayBtn').addEventListener('click', reset);
$('shareBtn').addEventListener('click', () => finish({ share: true }));
$('closeBtn').addEventListener('click', () => finish());
addEventListener('keydown', e => { if (e.key === 'Escape') finish(); });
if (given.communityLink) { $('joinBtn').href = given.communityLink; $('joinBtn').hidden = false; }
function updateWelcome() {
  $('welcomeTitle').innerHTML = ''; $('welcomeTitle').append('Welcome to the room, ');
  const b = document.createElement('b'); b.textContent = titleCase(member.name).split(' ')[0]; $('welcomeTitle').append(b, '.');
  $('welcomeSub').textContent = `Member ${member.id} · Since ${titleCase(member.since)}`;
}

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(window.__fast ? .2 : .05, clock.getDelta()), t = clock.elapsedTime;

  if (state === S.PRESSING) {
    press = Math.min(1, press + dt / 1.15);
    Sound.creak(press);
    sealWhole.scale.set(1 + press * .015, 1 - press * .1, 1 + press * .015);
    shake = Math.max(shake, press * .05);
    if (press > .72 && sealWhole.visible) { sealWhole.visible = false; sealA.visible = sealB.visible = true; Sound.burst('bandpass', 4200, 3, .03, .35); buzz(6); }
    if (sealA.visible) { sealA.scale.copy(sealWhole.scale); sealB.scale.copy(sealWhole.scale); }
    if (press >= 1) crack();
  } else if (state === S.SEALED && press > 0) { press = Math.max(0, press - dt * 3); sealWhole.scale.set(1, 1 - press * .1, 1); }
  ringFg.style.strokeDashoffset = 220 * (1 - press);

  if (autoFlap !== null) {
    const k = reduce ? 1 : 1 - Math.pow(.004, dt);
    theta += (autoFlap - theta) * k; Sound.set(Sound.paper, Math.min(.6, Math.abs(autoFlap - theta) * .35));
    if (Math.abs(autoFlap - theta) < .004) {
      theta = autoFlap; Sound.set(Sound.paper, 0);
      if (autoFlap > 1) { state = S.OPEN; hint(mobile ? 'Swipe down to pull your card out' : 'Drag down to pull your card out'); } else state = S.CRACKED;
      autoFlap = null;
    } else state = S.OPENING;
  }
  if (state >= S.CRACKED && state <= S.PULLING) bendFlap(theta);
  if (sealA && sealA.visible) { const f = flapFrame(SEAL_D); sealA.position.set(0, f.y + .002, f.z); sealA.rotation.x = f.phi; }

  if (autoSlide !== null) {
    slide += (autoSlide - slide) * (reduce ? 1 : 1 - Math.pow(.02, dt)); Sound.set(Sound.slide, Math.abs(autoSlide - slide) * .6);
    if (Math.abs(autoSlide - slide) < .01) { slide = autoSlide; autoSlide = null; Sound.set(Sound.slide, 0); if (slide >= 1) beginLift(); else state = S.OPEN; }
    else state = S.PULLING;
  }
  if (state === S.OPEN || state === S.PULLING) {
    const local = lerp(-HZ + .35, 3.2, easeOut(slide));
    card.position.z = local; card.position.y = 0;
    cardPivot.rotation.x = -.3 * smooth(-CH / 2 - .1, -CH / 2 + .9, local);
  }

  if (state === S.LIFTING) {
    liftT = Math.min(1, liftT + dt / (reduce ? .01 : 1.9));
    const e = easeInOut(liftT), arc = Math.sin(e * Math.PI) * 2.2;
    card.position.lerpVectors(liftFrom.p, liftTo.p, e); card.position.y += arc;
    card.quaternion.slerpQuaternions(liftFrom.q, liftTo.q, e);
    bokeh.enabled = true; bokeh.uniforms.focus.value = camera.position.distanceTo(card.position); bokeh.uniforms.aperture.value = .0018 * e;
    if (liftT >= 1) {
      state = S.REVEALED; Sound.chime(); buzz(10); revealCur.p.copy(liftTo.p); revealCur.q.copy(liftTo.q);
      $('welcome').classList.add('on'); sweep.userData.t = 0;
    }
  }
  if (state === S.REVEALED) {
    flipNow += (flipTarget - flipNow) * (1 - Math.pow(.002, dt));
    if (!down) { spin *= Math.pow(.08, dt); }
    const bob = reduce ? 0 : Math.sin(t * 1.2) * .06;
    const kr = 1 - Math.pow(.004, dt); revealCur.p.lerp(liftTo.p, kr); revealCur.q.slerp(liftTo.q, kr);
    const portrait = DESIGNS[design].portrait, upL = portrait ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, -1), rightL = portrait ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0);
    card.position.copy(revealCur.p); card.position.y += bob;
    const axisUp = upL.clone().applyQuaternion(revealCur.q);
    card.quaternion.copy(revealCur.q);
    card.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axisUp, flipNow + spin + (reduce ? 0 : Math.sin(t * .7) * .06)));
    sweep.userData.t = (sweep.userData.t || 0) + dt;
    const st = sweep.userData.t, k = clamp(st / 1.4, 0, 1);
    const right = rightL.clone().applyQuaternion(revealCur.q), nrm = new THREE.Vector3(0, 1, 0).applyQuaternion(revealCur.q);

    sweep.intensity = st < 1.6 ? Math.sin(k * Math.PI) * 26 : 0;

  composer.render();
  requestAnimationFrame(frame);
}

function resize() {

}
addEventListener('resize', resize);

/* ---------------- start ---------------- */
async function start() {
  try { await Promise.race([Promise.all(['900 40px Archivo', '800 40px Archivo', 'italic 600 40px "Cormorant Garamond"', '700 40px "Cormorant Garamond"', '600 40px Montserrat', '500 40px Montserrat', '400 40px "Share Tech Mono"', '700 40px "JetBrains Mono"', '800 40px Montserrat'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}

}
start();
